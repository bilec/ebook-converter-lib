[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook-converter-lib"
version = "1.1.0"
requires-python = ">= 3.11"
description = "Convert ebook between different formats"
dependencies = [
    "beautifulsoup4>=4.9.3",
    "css-parser>=1.0.6",
    "filelock>=3.0.12",
    "html2text>=2020.1.16",
    "lxml>=4.9.0",
    "markdown>=3.0",
    "odfpy>=1.4.1",
    "pillow>=8.0.1",
    "pypdf>=5.0.0",
    "python-dateutil>=2.8.1",
    "reportlab>=4.0",
    "svglib>=0.9.3",
    "tinycss>=0.4"
]
readme = "README.md"
authors = [
    {name = "bilec", email = "martin.bilka826@gmail.com"}
]
license = "GPL-3.0-or-later"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11"
]

[project.urls]
Repository = "https://github.com/bilec/ebook-converter-lib"

[project.scripts]
ebook-converter = "ebook_converter.main:main"

# html5_parser and msgpack ship top-level on purpose: they are pure-Python shims that must
# shadow the real PyPI packages, which need C extensions Chaquopy cannot build. Do not namespace.
[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

# "converter" stays top-level: econverter calls Python.getModule("converter") via Chaquopy.
[tool.setuptools]
py-modules = ["converter"]

[tool.setuptools.package-data]
"*" = ["*.types", "*.css", "*.html", "*.xhtml", "*.xsl", "*.json", "*.tmpl", "*.txt", "*.ttf", "*.otf"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["ebook_converter", "html5_parser", "msgpack"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
